# The captain channel's message server: NATS with JetStream for history.
# Started by `bin/jg-bus.sh serve`, which runs it from the home's state/bus
# directory so the relative store_dir lands there and never in the repo.
# A home may override this file at config/bus/nats.conf; the client address in
# defaults/captain-channel (nats-url) must name the port set here.
host: "127.0.0.1"
port: 4222
server_name: juggernaut-bus

jetstream {
  store_dir: "./jetstream"
  max_mem_store: 64Mb
  max_file_store: 256Mb
}
