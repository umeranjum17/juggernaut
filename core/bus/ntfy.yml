# The captain channel's delivery surface, run locally: ntfy with no public relay in
# front of it, bound to loopback by default. The address his iPad reaches over the
# tailnet is a home override of this file, never a shipped public endpoint. Started by
# `bin/jg-bus.sh serve` from the home's state/bus directory, so the relative cache
# file lands there. A home may override this file at config/bus/ntfy.yml.
# The relay switch is NOT here: it is `set ntfy-relay` in defaults/captain-channel,
# and the shipped value is off. Turning it on would publish the same event through
# ntfy-relay-server instead of this server; the captain has not answered that yet.
base-url: "http://127.0.0.1:2586"
listen-http: "127.0.0.1:2586"
cache-file: "./ntfy-cache.db"
cache-duration: "24h"
behind-proxy: false
enable-signup: false
# Nobody reads or writes the captain's topic anonymously: the server is reached over the tailnet
# once a home overrides listen-http, so access is deny-all and two logins exist (publisher
# write-only, captain read-only). The bus owner makes them with `bin/jg-bus.sh ntfy-provision`,
# which bin/jg-stack.sh up runs; delete these two lines for an open local server.
auth-file: "./ntfy-auth.db"
auth-default-access: "deny-all"
# ntfy's own delivery log: one DEBUG "Received message" line per publish, carrying the
# message_id that state/captain-channel-delivered.jsonl records, so bin/jg-captain-probe.sh can
# show the same event in both. It goes to stdout: state/bus/ntfy.log, or the unit's journal.
log-level: info
log-level-overrides:
  - "tag=publish -> debug"
