# One account per home on this machine's one JetStream server.
#
# Every home publishes and reads only its own prefix, so two homes on one machine
# cannot read each other's wakes, inboxes or captain events. The account name is
# the home's own name, and its user carries that home's credentials file.
#
# `bin/jg-bus.sh accounts` writes the concrete blocks for the homes on this
# machine into the home's state/bus directory; this file is the shape they take,
# and a home that is not listed here has no way onto the server at all.
#
# Per home <home>:
#   account <home> {
#     jetstream: { max_mem: 64Mb, max_file: 512Mb }
#     users: [ { user: <home>, password_file: <credentials> } ]
#     exports/imports: none - a home never needs another home's subjects
#   }
#
# Subjects, for a home whose name is <home>:
#   jg.<home>.wake.>     the wake queue
#   jg.<home>.inbox.>    the task inboxes
#   jg.<home>.captain.>  the captain channel
#
# The system account carries server events and no home subject.
