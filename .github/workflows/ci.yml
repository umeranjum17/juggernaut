name: CI

on:
  push:
    branches: [main]
  # Any base branch rather than only main, so a pull request stacked on another
  # feature branch is verified too instead of reporting no checks at all.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# Per-PR supersession: a new push to the same PR replaces that PR's in-flight
# CI instead of letting superseded heads keep the full hosted-runner fan-out.
# The group uses the PR number for pull_request events, so every run of one PR
# shares a group, and falls back to the unique run id for push events, so each
# main push gets its own group and is never cancelled. Cancellation is likewise
# limited to pull_request events. Evidence and rationale: the September 12
# Actions starvation report, section 3 "Workflow mechanics to ship first".
# The compliance workflow deliberately keeps its own event-specific groups; do
# not collapse it onto this simpler shape.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Timeout policy: docs/jg-test-portable-shards.md "Timeouts" owns the three
# tiers and their rationale.
# Each job comment identifies the tier implemented by its executable value.

# Draft pull requests skip every job (invariants and the required gate carry the
# check; the other jobs follow through `needs`) and run on ready_for_review.
# `edited` is deliberately not a trigger: no check reads the pull request body.
#
# Path scope: a documentation, media, or license change runs only the fast
# invariants job. bin/jg-ci-scope.sh owns that allowlist and the default that
# anything it cannot classify needs the whole suite, and `CI required` is the one
# required check: it fails whenever a lane this change needed did not run. The
# scope is a job-level condition, never a trigger filter, because a filtered-out
# workflow leaves its required check pending forever.
#
# Fork opt-out: a fork sets the repository variable JG_CI_SKIP_PUSH to 1 to
# skip the push run, and JG_CI_SKIP_MACOS to 1 to skip the macOS job, without
# a tracked edit that drifts from upstream; with neither set, every job runs
# exactly as before. The skip is a job-level condition, repeated per job
# because workflow syntax has no shared anchor, and never a trigger filter: a
# job skipped by its condition reports success, while a workflow filtered out
# at the trigger stays pending and blocks the merge. CONTRIBUTING.md documents
# the variables.
jobs:
  lint:
    name: Lint ${{ matrix.partition }}
    runs-on: ubuntu-latest
    needs: invariants
    if: ${{ needs.invariants.outputs.behavior == 'true' && !(github.event_name == 'push' && vars.JG_CI_SKIP_PUSH == '1') }}
    # Normal tier (see the timeout policy above).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Four partitions, not two: once the two heaviest roots really follow
        # their sources (bin/jg-lint.sh's measured allowance), a two-partition
        # slice costs 27 minutes of root time and reaches this 30-minute bound,
        # where the policy asks for a distribution fix rather than a longer
        # timeout. Each partition carries at most one heavy root and the four
        # are byte-weight balanced within a couple of KB.
        partition: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/jg-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          set -eu
          bin/jg-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Single owner of the lint definition (shell file set, config, version,
      # and GitHub workflow lint). Do not re-spell the checks here; keep CI
      # and the pre-push gate on this script so a self-broken ci.yml still
      # fails locally before merge.
      - name: Lint canonical partition
        env:
          # Fail closed rather than lint uncapped when a configured per-root
          # bound (wall deadline or memory rlimit) cannot be enforced here.
          JG_LINT_REQUIRE_BOUNDS: '1'
          JG_LINT_JOBS: '1'
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/jg-lint"
          bin/jg-lint.sh --partition "${{ matrix.partition }}of${{ strategy.job-total }}" \
            --telemetry "$RUNNER_TEMP/jg-lint/partition-${{ matrix.partition }}.tsv"
      - name: Upload lint telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jg-lint-telemetry-${{ matrix.partition }}
          path: |
            ${{ runner.temp }}/jg-lint/partition-${{ matrix.partition }}.tsv
            ${{ runner.temp }}/jg-lint/partition-${{ matrix.partition }}.roots.tsv
          if-no-files-found: warn

  # Two duration-balanced portable parallel shards of the Phase 2 proven-isolated
  # set only. Composition owner: bin/jg-test-run.sh (docs/jg-test-portable-shards.md).
  tests-portable-parallel-1:
    name: Behavior portable parallel 1
    runs-on: ubuntu-latest
    needs: invariants
    if: ${{ needs.invariants.outputs.behavior == 'true' && !(github.event_name == 'push' && vars.JG_CI_SKIP_PUSH == '1') }}
    # Normal tier (see the timeout policy above).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/jg-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          set -eu
          bin/jg-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install tasks-axi
        run: |
          set -eu
          npm install -g tasks-axi
          tasks-axi --version
      - name: Run portable parallel shard 1
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/jg-test"
          bin/jg-test-run.sh --lane portable-parallel-1 \
            --json "$RUNNER_TEMP/jg-test/jg-test-timing-portable-parallel-1.json"
      - name: Upload shard 1 timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jg-test-timing-portable-parallel-1
          path: ${{ runner.temp }}/jg-test/jg-test-timing-portable-parallel-1.json
          if-no-files-found: warn

  tests-portable-parallel-2:
    name: Behavior portable parallel 2
    runs-on: ubuntu-latest
    needs: invariants
    if: ${{ needs.invariants.outputs.behavior == 'true' && !(github.event_name == 'push' && vars.JG_CI_SKIP_PUSH == '1') }}
    # Normal tier (see the timeout policy above).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/jg-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          set -eu
          bin/jg-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install tasks-axi
        run: |
          set -eu
          npm install -g tasks-axi
          tasks-axi --version
      - name: Run portable parallel shard 2
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/jg-test"
          bin/jg-test-run.sh --lane portable-parallel-2 \
            --json "$RUNNER_TEMP/jg-test/jg-test-timing-portable-parallel-2.json"
      - name: Upload shard 2 timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jg-test-timing-portable-parallel-2
          path: ${{ runner.temp }}/jg-test/jg-test-timing-portable-parallel-2.json
          if-no-files-found: warn

  # Required portable serial remainder: watcher, lock, AFK, tmux, daemon,
  # ambiguous, and other stateful tests. Real Herdr stays in tests-herdr.
  # Split across separate runners so no two of these stateful scripts ever share
  # a machine: each shard is still strictly serial in itself. Shard membership
  # and the shard count both belong to bin/jg-test-run.sh, which refuses a lane
  # whose "ofN" disagrees with it (docs/jg-test-portable-shards.md).
  tests-portable-serial:
    name: Behavior portable serial ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: invariants
    if: ${{ needs.invariants.outputs.behavior == 'true' && !(github.event_name == 'push' && vars.JG_CI_SKIP_PUSH == '1') }}
    # Normal tier (see the timeout policy above).
    timeout-minutes: 30
    strategy:
      # Every shard reports so one failure never hides another shard's result.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/jg-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          set -eu
          bin/jg-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Require tmux for e2e tests
        run: |
          set -eu
          command -v tmux >/dev/null || {
            echo "::error::tmux is required for real afk injection e2e coverage"
            exit 1
          }
          tmux -V
      - name: Install tasks-axi for backlog-handoff delegation
        run: |
          set -eu
          npm install -g tasks-axi
          tasks-axi --version
      - name: Run portable serial shard ${{ matrix.shard }}
        env:
          # job-total rather than a literal, so shrinking or growing the matrix
          # without matching bin/jg-test-run.sh is refused instead of quietly
          # leaving a shard of the required lane unrun.
          JG_SERIAL_LANE: portable-serial-${{ matrix.shard }}of${{ strategy.job-total }}
          JG_SERIAL_SHARD: ${{ matrix.shard }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/jg-test"
          bin/jg-test-run.sh --lane "$JG_SERIAL_LANE" \
            --json "$RUNNER_TEMP/jg-test/jg-test-timing-portable-serial-${JG_SERIAL_SHARD}.json"
      - name: Upload portable serial shard ${{ matrix.shard }} timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jg-test-timing-portable-serial-${{ matrix.shard }}
          path: ${{ runner.temp }}/jg-test/jg-test-timing-portable-serial-${{ matrix.shard }}.json
          if-no-files-found: warn

  # Required real-Herdr lane: pinned install, serial real-herdr-gated family,
  # hard-fail on "skip: herdr not found". Starts on Linux x86_64; if a genuine
  # platform invariant fails (focus, cleanup, default-session tripwire), keep
  # the failure evidence and move the job to macOS rather than skip assertions.
  tests-herdr:
    name: Behavior tests (Herdr)
    runs-on: ubuntu-latest
    needs: invariants
    if: ${{ needs.invariants.outputs.behavior == 'true' && !(github.event_name == 'push' && vars.JG_CI_SKIP_PUSH == '1') }}
    # Heavy tier (see the timeout policy above): the last-resort job backstop.
    # The family-run step below owns the hang tripwire, so a wedged suite fails
    # there with the always() cleanup and timing upload still running.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require tools for real Herdr
        run: |
          set -eu
          command -v jq >/dev/null || { echo "::error::jq is required"; exit 1; }
          command -v python3 >/dev/null || { echo "::error::python3 is required"; exit 1; }
          command -v curl >/dev/null || { echo "::error::curl is required"; exit 1; }
          command -v tar >/dev/null || { echo "::error::tar is required"; exit 1; }
          jq --version
          python3 --version
      - name: Install pinned Herdr
        run: |
          set -eu
          bin/jg-install-herdr.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned Treehouse
        run: |
          set -eu
          # Several real-herdr-gated E2E scripts require treehouse for spawn
          # worktree acquisition (presentation, workspace-per-home, autodetect).
          bin/jg-install-treehouse.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Assert Herdr pin and protocol floor
        run: |
          set -eu
          command -v herdr >/dev/null || { echo "::error::herdr not on PATH after install"; exit 1; }
          command -v treehouse >/dev/null || { echo "::error::treehouse not on PATH after install"; exit 1; }
          herdr --version
          treehouse --version
          status=$(herdr status --json)
          printf '%s\n' "$status"
          version=$(printf '%s' "$status" | jq -r '.client.version // empty')
          protocol=$(printf '%s' "$status" | jq -r '.client.protocol // empty')
          [ "$version" = "0.7.4" ] || {
            echo "::error::expected exact Herdr pin 0.7.4, got ${version:-<empty>}"
            exit 1
          }
          case "$protocol" in
            ''|*[!0-9]*) echo "::error::could not read client protocol"; exit 1 ;;
          esac
          [ "$protocol" -ge 16 ] || {
            echo "::error::herdr protocol $protocol is below the required floor 16"
            exit 1
          }
      - name: Start default Herdr session for fleet-state tripwire
        run: |
          set -eu
          # Lab provision requires exactly one running default session so the
          # default-session tripwire can arm. Start it headless; never use it
          # for lab work (tests still refuse default and use jg-lab-* only).
          mkdir -p "$RUNNER_TEMP/jg-herdr"
          nohup herdr server >"$RUNNER_TEMP/jg-herdr/default-server.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/jg-herdr/default-server.pid"
          attempt=0
          while [ "$attempt" -lt 150 ]; do
            running=$(herdr status --json 2>/dev/null | jq -r '.server.running // false' || echo false)
            if [ "$running" = true ]; then
              herdr session list --json | jq -e '
                [.sessions[]? | select(.default == true and .name == "default" and .running == true)]
                | length == 1
              ' >/dev/null
              echo "default Herdr session is running"
              exit 0
            fi
            sleep 0.2
            attempt=$((attempt + 1))
          done
          echo "::error::default Herdr server did not become ready"
          cat "$RUNNER_TEMP/jg-herdr/default-server.log" || true
          exit 1
      - name: Snapshot pre-suite Herdr sessions
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/jg-herdr"
          bin/jg-herdr-ci-cleanup.sh snapshot "$RUNNER_TEMP/jg-herdr/sessions-before.json"
      - name: Run real-Herdr family (serial, required)
        id: run-real-herdr-family
        # Heavy tier step tripwire: above the healthy 7-10 minute wall and far
        # below the job backstop, so a hang fails this step and cleanup runs.
        timeout-minutes: 20
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/jg-test"
          # Serial only. Fail if any script reports herdr not found. Live
          # harness credential tests stay outside this family (opt-in env only).
          bin/jg-test-run.sh --family real-herdr-gated \
            --fail-on-gate-skip 'herdr not found' \
            --json "$RUNNER_TEMP/jg-test/jg-test-timing-herdr.json"
      - name: Cleanup job-owned Herdr lab sessions
        id: cleanup-herdr-lab-sessions
        if: always()
        run: |
          set -eu
          bin/jg-herdr-ci-cleanup.sh teardown "$RUNNER_TEMP/jg-herdr/sessions-before.json" || {
            echo "::warning::lab session cleanup reported a problem; see logs"
            # Surface diagnostics without weakening the suite result above.
            herdr session list --json || true
            exit 1
          }
      - name: Upload Herdr timing and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jg-test-timing-herdr
          path: |
            ${{ runner.temp }}/jg-test/jg-test-timing-herdr.json
            ${{ runner.temp }}/jg-herdr/sessions-before.json
            ${{ runner.temp }}/jg-herdr/default-server.log
          if-no-files-found: warn

  macos-stock-bash:
    name: Stock macOS Bash parse compatibility
    runs-on: macos-latest
    needs: invariants
    if: ${{ needs.invariants.outputs.behavior == 'true' && !(github.event_name == 'push' && vars.JG_CI_SKIP_PUSH == '1') && vars.JG_CI_SKIP_MACOS != '1' }}
    # Normal tier (see the timeout policy above).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Parse every shell file with stock Bash
        shell: /bin/bash {0}
        env:
          PATH: /bin:/usr/bin:/usr/sbin:/sbin:/usr/local/bin:/opt/homebrew/bin
        run: |
          set -eu
          case "$BASH_VERSION" in
            3.2.57*) ;;
            *) echo "::error::expected stock macOS Bash 3.2.57, got $BASH_VERSION"; exit 1 ;;
          esac
          /bin/bash --version | head -1
          command -v jq >/dev/null || { echo "::error::jq is required"; exit 1; }

          shell_inventory="$RUNNER_TEMP/jg-shell-inventory"
          bin/jg-lint.sh --list-files > "$shell_inventory"
          parse_fail=0
          while IFS= read -r f; do
            /bin/bash -n "$f" || { echo "::error::stock macOS Bash 3.2 failed to parse $f"; parse_fail=1; }
          done < "$shell_inventory"
          [ "$parse_fail" -eq 0 ] || { echo "::error::stock macOS Bash 3.2 parse sweep failed"; exit 1; }

          command -v npm >/dev/null || { echo "::error::npm is required to install tasks-axi"; exit 1; }
          npm install -g tasks-axi@0.2.6 >/dev/null
          PATH="$(npm prefix -g)/bin:$PATH"
          export PATH
          command -v tasks-axi >/dev/null || { echo "::error::tasks-axi is required for the stock Bash regression"; exit 1; }

          # The full public-followup suite is not a stock-bash snapshot; run only
          # the empty-lock register regression under real /bin/bash 3.2.
          pf_output=$(JG_TEST_ONLY=test_first_register_succeeds_with_empty_lock_list_under_bash32 \
            /bin/bash tests/jg-public-followup.test.sh)
          printf '%s\n' "$pf_output"
          pf_count=$(printf '%s\n' "$pf_output" | grep -c '^ok - ')
          [ "$pf_count" -eq 1 ] || {
            echo "::error::expected 1 public-followup bash 3.2 register regression, got $pf_count"
            exit 1
          }

  invariants:
    name: Repo invariants
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft && !(github.event_name == 'push' && vars.JG_CI_SKIP_PUSH == '1') }}
    # Fast tier: the invariant checks are seconds-long file comparisons, and the
    # complete-regression partition proof, so a cheap change still runs both.
    timeout-minutes: 5
    outputs:
      behavior: ${{ steps.scope.outputs.behavior }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The scope step diffs against the pull request's base commit.
          fetch-depth: 0
      - name: Classify the changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          # An unreadable diff keeps the full suite. A main push runs only
          # the invariants: every change already passed the full suite on its
          # pull request, so main repeats just the cheap repo-wide checks.
          if [ "$EVENT_NAME" = pull_request ]; then
            changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)
            printf '%s\n' "$changed" | bin/jg-ci-scope.sh >>"$GITHUB_OUTPUT"
          else
            echo behavior=false >>"$GITHUB_OUTPUT"
          fi
      # The one lint a documentation-only change gets. ShellCheck is absent for
      # a cheap change: no cheap path is a shell or workflow file.
      - name: Lint the workflow definitions
        run: |
          set -eu
          bin/jg-install-actionlint.sh "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/actionlint" -version
          PATH="$RUNNER_TEMP/bin:$PATH" bin/jg-lint-workflows.sh
      - name: Prove complete regression partition
        run: bin/jg-test-run.sh --check-coverage
      - name: Compatibility pointers must stay intact
        run: |
          set -eu
          [ ! -L CLAUDE.md ] || { echo "::error::CLAUDE.md must be a real @AGENTS.md pointer file, not a symlink"; exit 1; }
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          printf '%s\n' \
            '<!-- Points Claude at AGENTS.md via import; edit AGENTS.md, not this file. -->' \
            '@AGENTS.md' >"$tmp"
          cmp -s CLAUDE.md "$tmp" || { echo "::error::CLAUDE.md must be the canonical @AGENTS.md pointer"; exit 1; }
          [ "$(readlink .claude/skills)" = "../.agents/skills" ] || { echo "::error::.claude/skills must be a symlink to ../.agents/skills"; exit 1; }
      - name: Personal fleet paths must not be tracked
        run: |
          set -eu
          tracked=$(git ls-files -- data state config projects .no-mistakes)
          if [ -n "$tracked" ]; then
            echo "::error::Personal fleet paths are tracked in git:"
            printf '%s\n' "$tracked"
            exit 1
          fi

  # The one required status check: it always reports, refusing a needed lane that
  # did not run, and it carries the critical-path timing evidence.
  required:
    name: CI required
    runs-on: ubuntu-latest
    # Normal tier: the verdict is instant, the timing download is not.
    timeout-minutes: 30
    needs: [invariants, lint, tests-portable-parallel-1, tests-portable-parallel-2,
            tests-portable-serial, tests-herdr, macos-stock-bash]
    if: ${{ always() && !github.event.pull_request.draft && !(github.event_name == 'push' && vars.JG_CI_SKIP_PUSH == '1') }}
    steps:
      - uses: actions/checkout@v6
      - name: Refuse a change whose needed lanes did not run
        env:
          JG_CI_NEEDS: ${{ toJSON(needs) }}
          JG_CI_BEHAVIOR: ${{ needs.invariants.outputs.behavior }}
          JG_CI_SKIP_MACOS: ${{ vars.JG_CI_SKIP_MACOS }}
        run: bin/jg-ci-required.sh
      - name: Download lane timing artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: jg-test-timing-*
          path: ${{ runner.temp }}/jg-test-aggregate
          merge-multiple: true
      - name: Build aggregate timing summary
        continue-on-error: true
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/jg-test"
          shopt -s nullglob
          inputs=("$RUNNER_TEMP"/jg-test-aggregate/jg-test-timing-*.json)
          if [ "${#inputs[@]}" -eq 0 ]; then
            echo "::warning::no per-lane timing JSON found to aggregate"
            exit 0
          fi
          bin/jg-test-run.sh --aggregate-json \
            "$RUNNER_TEMP/jg-test/jg-test-timing-aggregate.json" \
            "${inputs[@]}"
      - name: Upload aggregate timing artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jg-test-timing-aggregate
          path: ${{ runner.temp }}/jg-test/jg-test-timing-aggregate.json
          if-no-files-found: warn
