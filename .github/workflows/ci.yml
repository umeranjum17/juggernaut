name: CI

on:
  push:
    branches: [main]
  # Any base branch rather than only main, so a pull request stacked on another
  # feature branch is verified too instead of reporting no checks at all.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# Per-PR supersession: a new push to the same PR replaces that PR's in-flight
# CI instead of letting superseded heads keep the full hosted-runner fan-out.
# The group uses the PR number for pull_request events, so every run of one PR
# shares a group, and falls back to the unique run id for push events, so each
# main push gets its own group and is never cancelled. Cancellation is likewise
# limited to pull_request events.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# This workflow is the pull request backstop, and it stays thin on purpose.
# It runs lint, shell syntax, a smoke run and the fast evals, so a whole run
# finishes in a few minutes instead of the half hour or more the behaviour suite
# took.
# The heavy behaviour suite is not a gate on a pull request any more:
# .github/workflows/behavior.yml runs it nightly and after every main push, and
# bin/jg-post-merge-ci.sh files exactly one fix item when that run goes red.
# Proof that a pull request head is good is the sealed local suite receipt from
# bin/jg-local-suite.sh, and bin/jg-ship-local.sh is the one command that pushes,
# proves, merges and syncs in that order.
#
# Draft pull requests skip every job (invariants and the required gate carry the
# check; the other jobs follow through `needs`) and run on ready_for_review.
# `edited` is deliberately not a trigger: no check reads the pull request body.
#
# Path scope: a documentation, media, or license change runs only the fast
# invariants job. bin/jg-ci-scope.sh owns that allowlist and the default that
# anything it cannot classify needs every lane, and `CI required` is the one
# required check: it fails whenever a lane this change needed did not run. The
# scope is a job-level condition, never a trigger filter, because a filtered-out
# workflow leaves its required check pending forever.
#
# Fork opt-out: a fork sets the repository variable JG_CI_SKIP_PUSH to 1 to skip
# the push run without a tracked edit that drifts from upstream; with it unset,
# every job runs exactly as before. The skip is a job-level condition, repeated
# per job because workflow syntax has no shared anchor, and never a trigger
# filter: a job skipped by its condition reports success, while a workflow
# filtered out at the trigger stays pending and blocks the merge.
# CONTRIBUTING.md documents the variable.
jobs:
  invariants:
    name: Repo invariants
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft && !(github.event_name == 'push' && vars.JG_CI_SKIP_PUSH == '1') }}
    # Fast tier: the invariant checks are seconds-long file comparisons, and the
    # complete-regression partition proof, so a cheap change still runs both.
    timeout-minutes: 5
    outputs:
      behavior: ${{ steps.scope.outputs.behavior }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The scope step diffs against the pull request's base commit.
          fetch-depth: 0
      - name: Classify the changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          # An unreadable diff keeps the full suite. A main push runs only
          # the invariants: every change already passed the full suite on its
          # pull request, so main repeats just the cheap repo-wide checks.
          if [ "$EVENT_NAME" = pull_request ]; then
            changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)
            printf '%s\n' "$changed" | bin/jg-ci-scope.sh >>"$GITHUB_OUTPUT"
          else
            echo behavior=false >>"$GITHUB_OUTPUT"
          fi
      # The one lint a documentation-only change gets. ShellCheck is absent for
      # a cheap change: no cheap path is a shell or workflow file.
      - name: Lint the workflow definitions
        run: |
          set -eu
          bin/jg-install-actionlint.sh "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/actionlint" -version
          PATH="$RUNNER_TEMP/bin:$PATH" bin/jg-lint-workflows.sh
      - name: Prove complete regression partition
        run: bin/jg-test-run.sh --check-coverage
      - name: Compatibility pointers must stay intact
        run: |
          set -eu
          [ ! -L CLAUDE.md ] || { echo "::error::CLAUDE.md must be a real @AGENTS.md pointer file, not a symlink"; exit 1; }
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          printf '%s\n' \
            '<!-- Points Claude at AGENTS.md via import; edit AGENTS.md, not this file. -->' \
            '@AGENTS.md' >"$tmp"
          cmp -s CLAUDE.md "$tmp" || { echo "::error::CLAUDE.md must be the canonical @AGENTS.md pointer"; exit 1; }
          [ "$(readlink .claude/skills)" = "../.agents/skills" ] || { echo "::error::.claude/skills must be a symlink to ../.agents/skills"; exit 1; }
      - name: Personal fleet paths must not be tracked
        run: |
          set -eu
          tracked=$(git ls-files -- data state config projects .no-mistakes)
          if [ -n "$tracked" ]; then
            echo "::error::Personal fleet paths are tracked in git:"
            printf '%s\n' "$tracked"
            exit 1
          fi

  lint:
    name: Lint ${{ matrix.partition }}
    runs-on: ubuntu-latest
    needs: invariants
    if: ${{ needs.invariants.outputs.behavior == 'true' && !(github.event_name == 'push' && vars.JG_CI_SKIP_PUSH == '1') }}
    # Normal tier (see the timeout policy in docs/jg-test-portable-shards.md).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/jg-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          set -eu
          bin/jg-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Single owner of the lint definition (shell file set, config, version,
      # and GitHub workflow lint). Do not re-spell the checks here; keep CI
      # and the pre-push gate on this script so a self-broken ci.yml still
      # fails locally before merge.
      - name: Lint canonical partition
        env:
          # Fail closed rather than lint uncapped when a configured per-root
          # bound (wall deadline or memory rlimit) cannot be enforced here.
          JG_LINT_REQUIRE_BOUNDS: '1'
          # Four partitions put the inventory on four runners, which is the only
          # lever that shortens the job: ShellCheck time is what the partition
          # carries, and bin/jg-lint.sh refuses more than two workers per root set.
          JG_LINT_JOBS: '2'
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/jg-lint"
          bin/jg-lint.sh --partition "${{ matrix.partition }}of${{ strategy.job-total }}" \
            --telemetry "$RUNNER_TEMP/jg-lint/partition-${{ matrix.partition }}.tsv"
      - name: Upload lint telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jg-lint-telemetry-${{ matrix.partition }}
          path: |
            ${{ runner.temp }}/jg-lint/partition-${{ matrix.partition }}.tsv
            ${{ runner.temp }}/jg-lint/partition-${{ matrix.partition }}.roots.tsv
          if-no-files-found: warn

  # Shell syntax is its own tripwire. bin/jg-lint.sh owns the file inventory, and
  # a parse error in any shell file fails here in seconds instead of after a
  # ShellCheck partition has finished analyzing it.
  syntax:
    name: Shell syntax
    runs-on: ubuntu-latest
    needs: invariants
    if: ${{ needs.invariants.outputs.behavior == 'true' && !(github.event_name == 'push' && vars.JG_CI_SKIP_PUSH == '1') }}
    # Fast tier (see the timeout policy in docs/jg-test-portable-shards.md).
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Parse every shell file
        run: |
          set -eu
          inventory="$RUNNER_TEMP/jg-shell-inventory"
          bin/jg-lint.sh --list-files > "$inventory"
          files=$(wc -l < "$inventory" | tr -d '[:space:]')
          echo "parsing $files shell files"
          fail=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            /bin/bash -n "$f" || { echo "::error::bash -n failed on $f"; fail=1; }
          done < "$inventory"
          [ "$fail" -eq 0 ] || exit 1

  # The smoke run: one eval that proves a home boots and its fleet view renders.
  # It is the cheapest signal that the product starts at all, and it fails in
  # seconds, before the evals job is judged.
  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    needs: invariants
    if: ${{ needs.invariants.outputs.behavior == 'true' && !(github.event_name == 'push' && vars.JG_CI_SKIP_PUSH == '1') }}
    # Fast tier (see the timeout policy in docs/jg-test-portable-shards.md).
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install tasks-axi
        run: |
          set -eu
          npm install -g tasks-axi
          tasks-axi --version
      - name: Run the smoke eval
        run: bin/jg-fast-evals.sh --smoke

  # The fast evals: deterministic behaviour checks over real entry points in a
  # throwaway home. bin/jg-fast-evals.sh owns the set; nothing here mocks a
  # command or calls a model, so the job is seconds long.
  evals:
    name: Fast evals
    runs-on: ubuntu-latest
    needs: invariants
    if: ${{ needs.invariants.outputs.behavior == 'true' && !(github.event_name == 'push' && vars.JG_CI_SKIP_PUSH == '1') }}
    # Fast tier (see the timeout policy in docs/jg-test-portable-shards.md).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install tasks-axi
        run: |
          set -eu
          npm install -g tasks-axi
          tasks-axi --version
      - name: Run the fast evals
        run: bin/jg-fast-evals.sh

  # The one required status check: it always reports, refusing a lane that did
  # not run.
  required:
    name: CI required
    runs-on: ubuntu-latest
    # Fast tier: the verdict is a few JSON reads.
    timeout-minutes: 5
    needs: [invariants, lint, syntax, smoke, evals]
    if: ${{ always() && !github.event.pull_request.draft && !(github.event_name == 'push' && vars.JG_CI_SKIP_PUSH == '1') }}
    steps:
      - uses: actions/checkout@v6
      - name: Refuse a change whose needed lanes did not run
        env:
          JG_CI_NEEDS: ${{ toJSON(needs) }}
          JG_CI_BEHAVIOR: ${{ needs.invariants.outputs.behavior }}
        run: bin/jg-ci-required.sh
